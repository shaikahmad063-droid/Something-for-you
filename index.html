<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Nida ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0a0812; --card: #141022; --accent: #d87093; --text-muted: #c7b8ea; }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Poppins', sans-serif; }
        body { background-color: var(--bg); color: #e2d9f3; min-height: 100vh; display: flex; flex-direction: column; justify-content: justify-content; align-items: center; text-align: center; padding: 20px; overflow-x: hidden; }

        nav { width: 100%; max-width: 800px; padding: 20px 0; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin-bottom: 40px; }
        nav a { color: var(--text-muted); text-decoration: none; font-size: 0.85rem; padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(199, 184, 234, 0.15); transition: 0.3s; }
        nav a:hover, nav a.active { background: rgba(216, 112, 147, 0.2); border-color: var(--accent); color: #fff; }

        .hero { max-width: 650px; margin: auto; padding: 40px 20px; background: var(--card); border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { font-family: 'Cormorant Garamond', serif; font-size: 3.5rem; color: var(--accent); font-weight: 500; margin-bottom: 15px; }
        p { font-size: 1.05rem; color: var(--text-muted); line-height: 1.8; margin-bottom: 35px; }

        .btn-next { display: inline-block; background: rgba(216, 112, 147, 0.15); color: #fff; border: 1px solid var(--accent); padding: 14px 32px; border-radius: 30px; text-decoration: none; font-size: 0.95rem; letter-spacing: 1px; transition: 0.3s; }
        .btn-next:hover { background: var(--accent); transform: translateY(-3px); box-shadow: 0 5px 20px rgba(216, 112, 147, 0.4); }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="active">Entrance</a>
        <a href="story.html">Our Story</a>
        <a href="reasons.html">About You</a>
        <a href="letter1.html">1-Month Letter</a>
        <a href="letter2.html">Quiet Thoughts</a>
        <a href="finale.html">Grand Finale</a>
    </nav>

    <div class="hero">
        <h1>Welcome, Nida.</h1>
        <p>A quiet corner created just for you. Take your time, walk through each page, and explore what I built for our 1-month milestone.</p>
        <a href="story.html" class="btn-next">Begin Our Journey →</a>
    </div>
</body>
